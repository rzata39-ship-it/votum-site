# Template: the nginx image substitutes ${SITE_ENV} at container start
# (/etc/nginx/templates → conf.d, see Dockerfile). Only SITE_ENV=production
# is indexable — every other environment answers with X-Robots-Tag.
map "${SITE_ENV}" $x_robots_tag {
    production "";
    default    "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An empty value (production) sends no header
    add_header X-Robots-Tag $x_robots_tag always;

    # Only the pre-rendered route files exist; anything else is a real 404
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag $x_robots_tag always;
        try_files $uri =404;
    }
}
