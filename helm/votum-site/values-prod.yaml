# NOT LIVE: www.votum.bg is served by Vercel (DNS points there) — see README "Deployment".
# If this path is ever activated, build the image with --build-arg SITE_ENV=production,
# otherwise the site answers with noindex.
global:
  namespace: votum-prod

nameOverride: votum-site-prod

image:
  repository: nexus.k8s.corp.polygran.de/votum/votum-site-dev
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - votum.bg
    - www.votum.bg
  tls: []
